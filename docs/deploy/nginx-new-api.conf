# Example Nginx reverse proxy for new-api.
# Replace www.lioniuiu.top, certificate paths, and upstream port as needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream new_api_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name www.lioniuiu.top lioniuiu.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.lioniuiu.top lioniuiu.top;

    ssl_certificate /etc/letsencrypt/live/www.lioniuiu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lioniuiu.top/privkey.pem;

    client_max_body_size 128m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://new_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
